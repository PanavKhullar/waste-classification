# =============================================================================
# Waste Classification — Master Configuration
# =============================================================================
# All key hyperparameters and paths in one place.
# Phases will reference and extend this as needed.

# -- Paths --
paths:
  data_raw: "data/raw"
  data_splits: "data/splits"
  artifacts: "artifacts"
  class_mapping: "data/splits/class_mapping.json"
  split_manifest: "data/splits/split_manifest.csv"

# -- Dataset --
dataset:
  name: "trashnet"
  num_classes: 6
  image_size: 224          # MobileNetV3 default input size
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  random_seed: 42

# -- Training --
training:
  batch_size: 32
  num_workers: 0           # 0 for Windows compatibility
  epochs: 30
  learning_rate: 0.001     # For frozen backbone (head only)
  fine_tune_lr: 0.00001    # For unfrozen layers
  weight_decay: 0.0001        # to avoid overfitting
  optimizer: "adam"
  early_stopping_patience: 7
  lr_scheduler_patience: 3
  lr_scheduler_factor: 0.2

# -- Model --
model:
  architecture: "mobilenet_v3_large"
  pretrained: true
  dropout: 0.5
  freeze_backbone: true    # Phase 2: true, Phase 3: false

# -- Augmentation (training only) --
augmentation:
  random_horizontal_flip: true
  random_rotation: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
    hue: 0.05
  random_resized_crop: true

# -- Reproducibility --
seed: 42
deterministic: true

